aid: onekey
name: OneKey
description: >-
  OneKey is a self-custody crypto wallet company — "Self Custody. Open Source.
  Fully Onchain." It builds open-source hardware wallets (OneKey Pro, Classic 1S,
  Classic 1S Pure, Lite) and cross-platform software wallets for macOS, Windows,
  Linux, iOS, Android, and Chrome, secured by an EAL6+ secure element and
  ISO/IEC 27001-certified operations. Its developer surface is the open-source
  Hardware JS SDK (@onekeyfe on npm) over WebUSB / BLE transports, an injected
  EIP-1193 dApp provider, air-gap QR signing for Bitcoin, Ethereum/EVM, Solana,
  and Tron, and the private-beta Agent Wallet that exposes wallet, swap, market,
  and safety skills to AI agents while keeping user control. Backed by Coinbase
  Ventures, Dragonfly, Ribbit Capital, and YZi Labs.
